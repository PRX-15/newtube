name: Build test APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Keep one signing identity across CI builds so Android accepts each APK as an update.
      - name: Restore persistent debug signing key
        env:
          KEYSTORE_PASSWORD: newtube-actions-debug
        run: |
          set -euo pipefail
          mkdir -p .ci-signing
          if ! gh run download --repo "$GITHUB_REPOSITORY" --name newtube-debug-signing-key --dir .ci-signing 2>/dev/null; then
            keytool -genkeypair -v \
              -keystore .ci-signing/newtube-debug.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD" \
              -alias newtube-debug \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=NewTube Debug,O=PRX-15,C=IN"
          fi
          cat > keystore.properties <<EOF
          storeFile=.ci-signing/newtube-debug.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=newtube-debug
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build arm64-v8a debug APK
        run: ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStmobileDebug -PrestrictedAbi=arm64-v8a

      - name: Save persistent debug signing key
        uses: actions/upload-artifact@v4
        with:
          name: newtube-debug-signing-key
          path: .ci-signing/newtube-debug.jks
          retention-days: 90
          if-no-files-found: error

      - name: Find arm64-v8a APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find smarttubetv/build/outputs/apk/stmobile/debug -type f -name '*arm64-v8a*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "::error::Could not find an arm64-v8a APK. Available APKs:"
            find smarttubetv/build/outputs/apk/stmobile/debug -type f -name '*.apk' -print
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload arm64-v8a debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NewTube-test-debug-arm64-v8a-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
